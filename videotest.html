<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 진단</title>
<style>
  body{ font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
        margin:0; padding:16px; background:#111; color:#eee; line-height:1.5; }
  h1{ font-size:18px; margin:0 0 12px; }
  #box video{ width:100%; height:200px; object-fit:cover; background:#000; border:1px solid #444; border-radius:8px; }
  .row{ padding:8px 10px; margin:6px 0; border-radius:6px; background:#1e1e1e; font-size:14px; word-break:break-all; }
  .k{ color:#8ab; }
  .ok{ color:#7d7; font-weight:700; }
  .bad{ color:#f77; font-weight:700; }
  button{ width:100%; padding:14px; font-size:16px; font-weight:700; margin-top:10px;
          background:#5C7F22; color:#fff; border:none; border-radius:8px; }
</style>
</head>
<body>
<h1>히어로 영상 진단 (이 화면을 캡처해서 보내주세요)</h1>
<div id="box">
  <video id="v" autoplay muted loop playsinline webkit-playsinline preload="auto"
         poster="assets/img/hero-poster.jpg">
    <source src="assets/video/hero.mp4" type="video/mp4">
  </video>
</div>
<button id="btn">▶ 여기를 탭해서 재생 시도</button>

<div class="row"><span class="k">동작 줄이기(reduce-motion):</span> <b id="rm">?</b></div>
<div class="row"><span class="k">데이터 절약(saveData):</span> <b id="sd">?</b></div>
<div class="row"><span class="k">영상 재생중(paused=false여야):</span> <b id="paused">?</b></div>
<div class="row"><span class="k">readyState(4=완전로드):</span> <b id="rs">?</b></div>
<div class="row"><span class="k">videoWidth(0이면 로드안됨):</span> <b id="vw">?</b></div>
<div class="row"><span class="k">영상 에러:</span> <b id="err">없음</b></div>
<div class="row"><span class="k">play() 결과:</span> <b id="playres">시도전</b></div>
<div class="row"><span class="k">브라우저:</span> <span id="ua"></span></div>

<script>
(function(){
  var v = document.getElementById('v');
  function T(id, val, good){ var e=document.getElementById(id); e.textContent=val; e.className = good===true?'ok':(good===false?'bad':''); }
  function refresh(){
    var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    T('rm', rm ? 'ON (이게 원인일 수 있음)' : 'off', rm ? false : true);
    var sd = navigator.connection && navigator.connection.saveData;
    T('sd', sd ? 'ON (이게 원인일 수 있음)' : 'off', sd ? false : true);
    T('paused', String(v.paused), v.paused===false);
    T('rs', String(v.readyState), v.readyState>=3);
    T('vw', String(v.videoWidth), v.videoWidth>0);
    document.getElementById('ua').textContent = navigator.userAgent;
  }
  v.addEventListener('error', function(){ var e=v.error; T('err', e?('code '+e.code):'error', false); });
  v.addEventListener('loadeddata', refresh);
  v.addEventListener('playing', refresh);
  v.addEventListener('pause', refresh);
  function tryPlay(){
    var p = v.play();
    if (p && p.then) p.then(function(){ T('playres','성공(재생됨)', true); refresh(); })
                      .catch(function(e){ T('playres','거부됨: '+e.name+' — '+e.message, false); refresh(); });
    else { T('playres','호출됨(구형)', null); refresh(); }
  }
  document.getElementById('btn').addEventListener('click', tryPlay);
  tryPlay();
  setInterval(refresh, 1000);
  refresh();
})();
</script>
</body>
</html>
